<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcaraván — Portal del Contribuyente</title>
    <link rel="stylesheet" href="libs/tailwind/tailwind.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <script src="libs/localforage.min.js"></script>
    <script src="libs/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="libs/supabase/supabase.min.js"></script>
    <script src="libs/jspdf/jspdf.umd.min.js"></script>

    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, sans-serif;
            background-color: #000000;
            background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.12), transparent);
            color: #f5f5f7;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>

<body class="min-h-screen flex flex-col select-none">

    <!-- Apple-style Frosted Navbar -->
    <header class="h-16 sticky top-0 z-50 backdrop-blur-2xl bg-black/60 border-b border-white/[0.08] px-6 sm:px-12 flex items-center justify-between transition-all">
        <div class="flex items-center gap-3">
            <span class="font-semibold text-sm tracking-tight text-white">Alcaraván</span>
            <span class="text-[10px] text-neutral-400 font-mono tracking-wider px-2 py-0.5 rounded-full bg-white/[0.04] border border-white/5 uppercase">Hacienda</span>
        </div>

        <div class="flex items-center gap-4 text-xs">
            <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-white/[0.04] border border-white/5 text-neutral-400 font-mono text-[11px]">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                <span>BCV: 56,50 Bs.</span>
            </div>

            <a href="admin.html" 
               class="text-neutral-400 hover:text-white text-xs font-medium transition flex items-center gap-1.5 px-3 py-1.5 rounded-full hover:bg-white/[0.05]">
                <span>Funcionarios</span>
                <i class="fas fa-chevron-right text-[9px] opacity-70"></i>
            </a>
        </div>
    </header>

    <!-- Main Dynamic Content -->
    <main class="flex-1 px-6 sm:px-12 py-8 overflow-y-auto">
        <div id="portal-main-content">
            <!-- Renderizado dinámico del módulo PortalComercio -->
        </div>
    </main>

    <!-- Apple Minimal Footer -->
    <footer class="py-8 px-6 sm:px-12 border-t border-white/[0.05] text-center text-xs text-neutral-500 font-normal">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-[11px]">
            <div>
                Alcaldía Municipal · Sistema Tributario Digital
            </div>
            <div class="text-neutral-600 font-mono">
                LOCAT 2026 · SGB 0ms
            </div>
        </div>
    </footer>

    <!-- Scripts de la Aplicación -->
    <script src="js/config.js"></script>
    <script>
        if (typeof supabase !== 'undefined' && window.HACIENDA_CONFIG && window.HACIENDA_CONFIG.SUPABASE_URL) {
            try {
                window.supabaseClient = supabase.createClient(
                    window.HACIENDA_CONFIG.SUPABASE_URL,
                    window.HACIENDA_CONFIG.SUPABASE_ANON_KEY
                );
            } catch (err) {
                console.warn("[Hacienda] Supabase:", err);
            }
        }
    </script>
    <script src="js/core/store.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/modules/patentes/catalogo-locat.js"></script>
    <script src="js/modules/portal-comercio.js"></script>

    <!-- Inicializador -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.HaciendaStore) {
                await window.HaciendaStore.init();
            }

            const container = document.getElementById('portal-main-content');
            if (container && window.PortalComercio) {
                window.PortalComercio.render(container);
            }

            // Reactividad a 0ms
            window.addEventListener('hacienda-db-updated', () => {
                if (container && window.PortalComercio) {
                    window.PortalComercio.render(container);
                }
            });
        });
    </script>
</body>

</html>
