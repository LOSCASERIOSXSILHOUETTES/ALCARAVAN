<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Tributario del Contribuyente — Alcaldía Municipal (LOCAT)</title>
    <link rel="stylesheet" href="libs/tailwind/tailwind.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <script src="libs/localforage.min.js"></script>
    <script src="libs/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="libs/supabase/supabase.min.js"></script>
    <script src="libs/jspdf/jspdf.umd.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col select-none">

    <!-- Barra de Navegación Pública -->
    <header class="h-20 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 sm:px-12 sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-white text-xl font-black shadow-lg">
                <i class="fas fa-landmark"></i>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-black text-slate-100 uppercase tracking-wider">Hacienda Municipal</h1>
                <span class="text-[10px] text-sky-400 font-bold font-mono">PORTAL DEL CONTRIBUYENTE · LOCAT 2026</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden sm:flex items-center gap-2 bg-slate-950 px-3.5 py-2 rounded-xl border border-slate-800 text-xs">
                <span class="text-slate-400">Tasa Oficial BCV:</span>
                <span class="font-mono font-bold text-amber-400">56,50 Bs./TCMMV</span>
            </div>

            <!-- Acceso a Ruta Especial de Funcionarios -->
            <a href="admin.html" 
               class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold text-xs rounded-xl border border-slate-700 transition flex items-center gap-2 shadow">
                <i class="fas fa-user-shield text-sky-400"></i>
                <span class="hidden md:inline">Acceso Funcionarios</span>
                <span class="md:hidden">ERP</span>
            </a>
        </div>
    </header>

    <!-- Contenido Dinámico del Portal del Comercio -->
    <main class="flex-1 overflow-y-auto px-4 sm:px-8 py-6">
        <div id="portal-main-content">
            <!-- Renderizado dinámico del módulo PortalComercio -->
        </div>
    </main>

    <!-- Pie de Página Institucional -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 px-6 sm:px-12 text-center text-xs text-slate-500">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div>
                Alcaldía Municipal · Dirección de Hacienda y Administración Tributaria
            </div>
            <div class="font-mono text-[11px] text-slate-400">
                Cumplimiento Ley LOCAT · Motor SGB 0ms Offline-First
            </div>
        </div>
    </footer>

    <!-- Scripts de la Aplicación -->
    <script src="js/config.js"></script>
    <script>
        if (typeof supabase !== 'undefined' && window.HACIENDA_CONFIG && window.HACIENDA_CONFIG.SUPABASE_URL) {
            try {
                window.supabaseClient = supabase.createClient(
                    window.HACIENDA_CONFIG.SUPABASE_URL,
                    window.HACIENDA_CONFIG.SUPABASE_ANON_KEY
                );
            } catch (err) {
                console.warn("[Hacienda] Error inicializando Supabase:", err);
            }
        }
    </script>
    <script src="js/core/store.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/modules/patentes/catalogo-locat.js"></script>
    <script src="js/modules/portal-comercio.js"></script>

    <!-- Inicializador del Portal del Contribuyente -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("[Portal Contribuyente] Inicializando a 0ms...");
            if (window.HaciendaStore) {
                await window.HaciendaStore.init();
            }

            const container = document.getElementById('portal-main-content');
            if (container && window.PortalComercio) {
                window.PortalComercio.render(container);
            }

            // Reactividad a 0ms
            window.addEventListener('hacienda-db-updated', () => {
                if (container && window.PortalComercio) {
                    window.PortalComercio.render(container);
                }
            });
        });
    </script>
</body>

</html>
