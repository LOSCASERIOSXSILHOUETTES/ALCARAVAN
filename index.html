<!DOCTYPE html>
<html lang="es" class="sgb-light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcaraván — Portal del Contribuyente</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7C3AED">

    <script>
        (function() {
            try {
                const saved = localStorage.getItem('hacienda_theme') || 'sgb-light';
                document.documentElement.className = saved;
            } catch(e) {}
        })();
    </script>

    <link rel="stylesheet" href="libs/tailwind/tailwind.min.css">
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=3.8.7">
    <script src="libs/localforage.min.js"></script>
    <script src="libs/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="libs/supabase/supabase.min.js"></script>
    <script src="libs/jspdf/jspdf.umd.min.js"></script>

    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }

        @keyframes tickerTape {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-wrapper {
            position: relative;
            overflow: hidden;
            mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
        }
        .ticker-track {
            display: flex;
            width: max-content;
            animation: tickerTape 36s linear infinite;
        }
        .ticker-track:hover {
            animation-play-state: paused;
        }

        /* Resets de visibilidad universal para Selects y Options en Portal */
        select {
            color-scheme: light !important;
        }
        select option, select optgroup {
            background-color: #FFFFFF !important;
            color: #0F172A !important;
            font-size: 13px !important;
            font-weight: 600 !important;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between select-none bg-white portal-light">

    <!-- Header Exacto Mockup -->
    <header class="h-16 bg-white border-b border-slate-100 px-6 sm:px-12 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3.5">
            <span class="text-2xl font-black text-black tracking-tighter leading-none select-none">A</span>
            <span class="font-bold text-base text-black tracking-tight leading-none">Alcaraván</span>
            <span class="h-4 w-px bg-slate-200"></span>
            <span class="text-sm text-slate-500 font-normal leading-none">San José de Guaribe</span>
        </div>

        <div class="flex items-center gap-5">
            <div id="sync-status-badge" class="hidden"></div>
            <button onclick="if(window.PortalComercio) window.PortalComercio.mostrarModalTasas()" 
                    class="hidden sm:flex items-center gap-1.5 text-xs text-slate-600 font-medium hover:text-black transition">
                <span>TCMMV BCV: <strong data-tasa="tcmmv" class="font-bold text-slate-800">1.009,07 Bs.</strong></span>
                <i class="fas fa-chevron-down text-[9px] text-slate-400"></i>
            </button>
            <a href="admin.html" 
               class="text-xs font-medium text-slate-700 hover:text-black border border-slate-200 hover:border-slate-300 rounded-lg px-3 py-1.5 transition">
                Funcionarios
            </a>
        </div>
    </header>

    <!-- Main Dynamic Content Centered -->
    <main class="flex-1 flex flex-col justify-center items-center px-4 py-8">
        <div id="portal-main-content" class="w-full">
            <!-- Renderizado dinámico del módulo PortalComercio -->
        </div>
    </main>

    <!-- Footer Exacto Mockup -->
    <footer class="py-6 px-6 sm:px-12 border-t border-slate-100 text-xs text-slate-400 bg-white shrink-0">
        <div class="w-full flex items-center justify-between">
            <div>
                Alcaldía de San José de Guaribe · SATRIMG
            </div>
            <div>
                <button onclick="if(window.PortalComercio) window.PortalComercio.abrirArticulado('ord_locat')" 
                        class="text-slate-400 hover:text-slate-600 transition">
                    Marco Legal LOCAT
                </button>
            </div>
        </div>
    </footer>

    <!-- Scripts de la Aplicación -->
    <script>window.HACIENDA_CONTEXT = 'portal';</script>
    <script src="js/config.js"></script>
    <script>
        if (typeof supabase !== 'undefined' && window.HACIENDA_CONFIG && window.HACIENDA_CONFIG.SUPABASE_URL) {
            try {
                window.supabaseClient = supabase.createClient(
                    window.HACIENDA_CONFIG.SUPABASE_URL,
                    window.HACIENDA_CONFIG.SUPABASE_ANON_KEY
                );
            } catch (err) {
                console.warn("[Hacienda] Supabase:", err);
            }
        }
    </script>
    <script src="js/core/store.js"></script>
    <script src="js/core/realtime-sync.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/services/tasas-bcv.js"></script>
    <script src="js/modules/patentes/catalogo-locat.js"></script>
    <script src="js/modules/patentes/catalogo-vehiculos.js"></script>
    <script src="js/modules/portal-comercio.js"></script>

    <!-- Inicializador -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Reloj y fecha en vivo de San José de Guaribe
            function actualizarReloj() {
                const ahora = new Date();
                const fechaEl = document.getElementById('fechaActual');
                const horaEl = document.getElementById('horaActual');
                if (fechaEl) {
                    fechaEl.textContent = ahora.toLocaleDateString('es-VE', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                }
                if (horaEl) {
                    horaEl.textContent = ahora.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
            }
            actualizarReloj();
            setInterval(actualizarReloj, 1000);

            // Inicializar servicio de tasas BCV en vivo
            if (window.TasasBCV) {
                window.TasasBCV.init();
            }

            if (window.HaciendaStore) {
                await window.HaciendaStore.init();
            }

            if (window.HaciendaRealtime) {
                window.HaciendaRealtime.init();
            }

            const container = document.getElementById('portal-main-content');
            if (container && window.PortalComercio) {
                window.PortalComercio.render(container);
            }

            // Reactividad ante actualizaciones de datos o tasas BCV
            window.addEventListener('hacienda-db-updated', () => {
                if (container && window.PortalComercio) {
                    window.PortalComercio.render(container);
                }
            });

            window.addEventListener('tasas-bcv-updated', () => {
                if (container && window.PortalComercio) {
                    window.PortalComercio.render(container);
                }
            });

            // Registro de Service Worker PWA Offline-First
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        reg.onupdatefound = () => {
                            const installingWorker = reg.installing;
                            if (installingWorker) {
                                installingWorker.onstatechange = () => {
                                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        window.location.reload();
                                    }
                                };
                            }
                        };
                    })
                    .catch(err => console.warn('[Alcaraván SW] Error:', err));
            }
        });
    </script>
</body>

</html>
